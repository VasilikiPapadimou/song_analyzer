[project]
name = "song-analyzer"
version = "0.1.0"
description = "A structured LLM-based song lyrics analysis and evaluation pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "openai>=2.32.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]